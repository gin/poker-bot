[project]
name = "poker-bot"
version = "3.0.0"
description = "Poker bot to enter dev.fun's arena"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langfuse>=4.9.1",
    "numpy>=2.5.0",
    "torch>=2.12.1",
]

[project.scripts]
benchmark = "eval.benchmark:main"
cfr-train = "eval.cfr_train:main"
neural-train = "eval.neural_train:main"
population-selfplay = "eval.population_selfplay:main"
promotion-gate = "eval.promotion_gate:main"
selfplay = "eval.selfplay:main"
simulator = "eval.simulator_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.43",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.uv]
package = true
